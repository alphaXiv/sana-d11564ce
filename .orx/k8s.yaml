apiVersion: batch/v1
kind: Job
metadata:
  name: sana2-{{ORX_RUN}}
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: run
          image: nvcr.io/nvidia/pytorch:25.06-py3
          command: ["bash", "-c", "eval \"$ORX_SCRIPT\""]
          workingDir: /workspace
          resources:
            requests:
              nvidia.com/gpu: "4"
              cpu: "30"
              memory: "220Gi"
            limits:
              nvidia.com/gpu: "4"
              memory: "220Gi"
          volumeMounts:
            - name: shared
              mountPath: /shared
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shared
          persistentVolumeClaim:
            claimName: sana2-shared
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
